const groups=[];
const clock=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
function drawHighlights(svg,scene,t){svg.replaceChildren(...(scene.highlights||[]).filter(h=>t>=h.start&&t<=h.end).map(({rect:[x,y,w,h]})=>{const r=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const[k,v]of Object.entries({x:x*832,y:y*480,width:w*832,height:h*480,fill:'none',stroke:'#ed1c24','stroke-width':2,'vector-effect':'non-scaling-stroke'}))r.setAttribute(k,String(v));return r;}));}
async function downloadWholeClip(clip,signal,onProgress){
 const response=await fetch(clip.src,{credentials:'omit',signal});
 if(!response.ok)throw new Error('Video download failed ('+response.status+'). Please try again.');

  const reader=response.body.getReader();
  for(;;){const {done,value}=await reader.read();if(done)break;chunks.push(value);bytes+=value.byteLength;onProgress(bytes,expected);}
 }else{const blob=await response.blob();chunks.push(blob);bytes=blob.size;onProgress(bytes,expected);}

}
