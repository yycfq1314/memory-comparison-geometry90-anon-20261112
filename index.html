<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>memory_comparison</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}main{max-width:1920px;margin:0 auto;padding:24px 24px 0}.comparison{padding:0 0 30px;margin:0 0 34px;border-bottom:1px solid #ddd}.comparison:last-child{border-bottom:0;margin-bottom:0}.videos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.clip{min-width:0}.clip h2{font-size:clamp(14px,1.1vw,21px);font-weight:600;margin:0 0 8px;line-height:1.25}.clip video{display:block;width:100%;aspect-ratio:832/480;object-fit:contain;background:#111}.controls{display:flex;gap:12px;align-items:center;margin-top:14px;font-size:13px}.controls button{font:inherit;color:#111;background:#fff;border:1px solid #aaa;border-radius:3px;padding:9px 18px;cursor:pointer}.controls .play{background:#d8eac8;border-color:#b3c99e;min-width:96px}.controls button:disabled{opacity:.5;cursor:wait}.controls .speed{display:flex;align-items:center;gap:6px;white-space:nowrap}.controls select{font:inherit;color:#111;background:#fff;border:1px solid #aaa;border-radius:3px;padding:8px 6px;cursor:pointer}.controls{flex-wrap:wrap}.controls output{font-variant-numeric:tabular-nums;color:#555;margin-left:auto;font-size:12px}.timeline{display:block;width:100%;margin:13px 0 0;accent-color:#77966a;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #547745;outline-offset:3px}#error{margin:0 24px 24px;font-size:13px;color:#555}#error:empty{display:none}@media(max-width:1000px){.videos{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}.clip h2{font-size:16px}}@media(max-width:560px){main{padding:15px 12px 0}.videos{grid-template-columns:1fr;gap:14px}.comparison{margin-bottom:25px;padding-bottom:25px}.controls{gap:9px}.controls button{padding:8px 14px}.clip h2{font-size:17px}.controls output{font-size:11px}}

</style></head><body><main id="comparisons" aria-label="Video comparisons"></main><p id="error" role="status"></p><script>const VARIANT="geometry90";const displayData={"comparisons":[{"id":"library","fps":24,"frames":957,"clips":[{"method":"GeometryOnly","label":"Geometry Base*","src":"https://memory-comparison.netlify.app/media/library/GeometryOnly.mp4","poster":"https://memory-comparison.netlify.app/media/library/GeometryOnly.jpg"},{"method":"GeometrySemantic","label":"Geometry + Semantics","src":"https://memory-video-comparisons.netlify.app/media/library/GeometrySemantic.mp4","poster":"https://memory-video-comparisons.netlify.app/media/library/GeometrySemantic.jpg"},{"method":"SMI","label":"SMI(Qwen3.5)","src":"https://memory-comparison.netlify.app/media/library/SMI.mp4","poster":"https://memory-comparison.netlify.app/media/library/SMI.jpg"},{"method":"Astra","label":"SMI(GPT6-Astra)","src":"https://memory-comparison.netlify.app/media/library/Astra.mp4","poster":"https://memory-comparison.netlify.app/media/library/Astra.jpg"}],"highlights":[{"start":0,"end":1.5,"rect":[0.015,0.12,0.29,0.85]},{"start":35,"end":39.875,"rect":[0.015,0.12,0.29,0.85]}]},{"id":"courtyard","fps":24,"frames":1085,"clips":[{"method":"GeometryOnly","label":"Geometry Base*","src":"https://memory-comparison.netlify.app/media/courtyard/GeometryOnly.mp4","poster":"https://memory-comparison.netlify.app/media/courtyard/GeometryOnly.jpg"},{"method":"GeometrySemantic","label":"Geometry + Semantics","src":"https://memory-video-comparisons.netlify.app/media/courtyard/GeometrySemantic.mp4","poster":"https://memory-video-comparisons.netlify.app/media/courtyard/GeometrySemantic.jpg"},{"method":"SMI","label":"SMI(Qwen3.5)","src":"https://memory-comparison.netlify.app/media/courtyard/SMI.mp4","poster":"https://memory-comparison.netlify.app/media/courtyard/SMI.jpg"},{"method":"Astra","label":"SMI(GPT6-Astra)","src":"https://memory-comparison.netlify.app/media/courtyard/Astra.mp4","poster":"https://memory-comparison.netlify.app/media/courtyard/Astra.jpg"}],"highlights":[{"start":0,"end":1.5,"rect":[0.73,0.29,0.25,0.14]},{"start":22,"end":45.208333333333336,"rect":[0.47,0.29,0.49,0.18]}]},{"id":"plaza","fps":24,"frames":1080,"clips":[{"method":"GeometryOnly","label":"Geometry Base*","src":"https://memory-comparison.netlify.app/media/plaza/GeometryOnly.mp4","poster":"https://memory-comparison.netlify.app/media/plaza/GeometryOnly.jpg"},{"method":"GeometrySemantic","label":"Geometry + Semantics","src":"https://memory-video-comparisons.netlify.app/media/plaza/GeometrySemantic.mp4","poster":"https://memory-video-comparisons.netlify.app/media/plaza/GeometrySemantic.jpg"},{"method":"SMI","label":"SMI(Qwen3.5) ","src":"https://memory-comparison.netlify.app/media/plaza/SMI-demo.mp4","poster":"https://memory-comparison.netlify.app/media/plaza/SMI-demo.jpg"},{"method":"Astra","label":"SMI(GPT6-Astra)","src":"https://memory-comparison.netlify.app/media/plaza/Astra.mp4","poster":"https://memory-comparison.netlify.app/media/plaza/Astra.jpg"}],"highlights":[{"start":0,"end":1.5,"rect":[0.6,0.015,0.395,0.34]},{"start":24,"end":28,"rect":[0.6,0.015,0.395,0.34]}]},{"id":"pottery","fps":24,"frames":957,"clips":[{"method":"GeometryOnly","label":"Geometry Base*","src":"https://memory-comparison.netlify.app/media/pottery/GeometryOnly.mp4","poster":"https://memory-comparison.netlify.app/media/pottery/GeometryOnly.jpg"},{"method":"GeometrySemantic","label":"Geometry + Semantics","src":"https://memory-video-comparisons.netlify.app/media/pottery/GeometrySemantic.mp4","poster":"https://memory-video-comparisons.netlify.app/media/pottery/GeometrySemantic.jpg"},{"method":"SMI","label":"SMI(Qwen3.5)","src":"https://memory-comparison.netlify.app/media/pottery/SMI.mp4","poster":"https://memory-comparison.netlify.app/media/pottery/SMI.jpg"},{"method":"Astra","label":"SMI(GPT6-Astra)","src":"https://memory-comparison.netlify.app/media/pottery/Astra.mp4","poster":"https://memory-comparison.netlify.app/media/pottery/Astra.jpg"}],"highlights":[{"start":0,"end":1.5,"rect":[0.65,0.37,0.34,0.61]},{"start":32,"end":39.875,"rect":[0.65,0.37,0.34,0.61]}]},{"id":"garage","fps":24,"frames":957,"clips":[{"method":"GeometryOnly","label":"Geometry Base*","src":"https://memory-comparison.netlify.app/media/garage/GeometryOnly.mp4","poster":"https://memory-comparison.netlify.app/media/garage/GeometryOnly.jpg"},{"method":"GeometrySemantic","label":"Geometry + Semantics","src":"https://memory-video-comparisons.netlify.app/media/garage/GeometrySemantic.mp4","poster":"https://memory-video-comparisons.netlify.app/media/garage/GeometrySemantic.jpg"},{"method":"SMI","label":"SMI(Qwen3.5)","src":"https://memory-comparison.netlify.app/media/garage/SMI.mp4","poster":"https://memory-comparison.netlify.app/media/garage/SMI.jpg"},{"method":"Astra","label":"SMI(GPT6-Astra)","src":"https://memory-comparison.netlify.app/media/garage/Astra.mp4","poster":"https://memory-comparison.netlify.app/media/garage/Astra.jpg"}],"highlights":[{"start":0,"end":1.5,"rect":[0.68,0.3,0.31,0.68]},{"start":32,"end":39.875,"rect":[0.68,0.3,0.31,0.68]}]}]};
if(VARIANT==="geometry90"){for(const scene of displayData.comparisons){scene.clips[1]={method:"Geometry90",label:"Geometry-only",src:"https://memory-comparison.netlify.app/media/"+scene.id+"/Geometry90.mp4",poster:"https://memory-comparison.netlify.app/media/"+scene.id+"/Geometry90.jpg"};if(scene.id==="courtyard")scene.frames=Math.min(scene.frames,1080);}}
'use strict';
const groups=[];
function highlightBoxes(scene,t){return(scene.highlights||[]).filter(h=>t>=h.start&&t<=h.end).map(h=>h.rect);}
function drawHighlights(svg,scene,t){svg.replaceChildren(...highlightBoxes(scene,t).map(([x,y,w,h])=>{const r=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const[k,v]of Object.entries({x:x*832,y:y*480,width:w*832,height:h*480,fill:'none',stroke:'#ed1c24','stroke-width':2,'vector-effect':'non-scaling-stroke'}))r.setAttribute(k,String(v));return r;}));}
const clock=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
function makeComparison(scene,index){
 const section=document.createElement('section');section.className='comparison';section.setAttribute('aria-label','Comparison '+(index+1));section.dataset.case=scene.id;
 const grid=document.createElement('div');grid.className='videos';
 const controls=document.createElement('div');controls.className='controls';
 const play=document.createElement('button');play.type='button';play.className='play';play.textContent='Play all';
 const restart=document.createElement('button');restart.type='button';restart.textContent='Restart';
 const speedLabel=document.createElement('label');speedLabel.className='speed';speedLabel.textContent='Speed';
 const speed=document.createElement('select');speed.setAttribute('aria-label','Comparison '+(index+1)+' playback speed');for(const rate of [1,1.5,2,3,4]){const option=document.createElement('option');option.value=String(rate);option.textContent=rate+'\u00d7';speed.append(option);}speed.value='1';speedLabel.append(speed);
 const output=document.createElement('output');output.textContent='00:00 / '+clock(scene.frames/scene.fps);
 const timeline=document.createElement('input');timeline.type='range';timeline.min=0;timeline.max=scene.frames-1;timeline.value=0;timeline.step=1;timeline.className='timeline';timeline.setAttribute('aria-label','Comparison '+(index+1)+' timeline');timeline.disabled=true;
 const group={section,videos:[],overlays:[],playing:false,ready:false,loading:null,raf:0,playVersion:0,rate:1,buffering:false,resumePending:false,lastSync:0};groups.push(group);
 function display(t){group.overlays.forEach((svg,i)=>drawHighlights(svg,scene,group.videos[i].currentTime||t));timeline.value=Math.min(scene.frames-1,Math.floor(t*scene.fps+.001));output.textContent=clock(t)+' / '+clock(scene.frames/scene.fps);}
 group.pause=()=>{group.playVersion++;group.playing=false;group.buffering=false;group.resumePending=false;group.videos.forEach(v=>v.pause());cancelAnimationFrame(group.raf);play.textContent='Play all';};
 async function load(){
  if(group.loading)return group.loading;
  group.loading=Promise.all(group.videos.map((v,i)=>new Promise((resolve,reject)=>{
   const timer=setTimeout(()=>reject(new Error('Video loading timed out. Please refresh this page.')),45000);v.addEventListener('loadedmetadata',()=>{clearTimeout(timer);v.defaultPlaybackRate=group.rate;v.playbackRate=group.rate;resolve();},{once:true});v.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('A video could not load. Please refresh this page.'));},{once:true});v.preload='auto';v.src=scene.clips[i].src;
  }))).then(()=>{group.ready=true;timeline.disabled=false;});
  return group.loading;
 }
 function seek(f){const t=Math.max(0,Math.min(scene.frames-1,Math.round(Number(f)||0)))/scene.fps;group.pause();group.videos.forEach(v=>{v.currentTime=t;});display(t);}
 function bufferedAhead(v,t=v.currentTime){for(let i=0;i<v.buffered.length;i++){if(v.buffered.start(i)<=t+.025&&v.buffered.end(i)>t)return v.buffered.end(i)-t;}return 0;}
 function bufferGroup(){
  group.buffering=true;group.videos.forEach(v=>v.pause());play.textContent='Buffering...';
  const t=Math.min(...group.videos.map(v=>v.currentTime));
  if(group.videos.every(v=>bufferedAhead(v,t)>0)){group.videos.forEach(v=>{if(Math.abs(v.currentTime-t)>.15)v.currentTime=t;});}
 }
 function resumeBuffered(){
  if(group.resumePending)return;
  const remain=(scene.frames-1)/scene.fps-Math.min(...group.videos.map(v=>v.currentTime));
  const needed=Math.min(2*group.rate,Math.max(0,remain-.05));
  if(!group.videos.every(v=>!v.seeking&&(v.readyState>=3||(remain<=.1&&v.readyState>=2))&&bufferedAhead(v)>=needed))return;
  group.resumePending=true;const version=group.playVersion;
  Promise.all(group.videos.map(v=>{v.playbackRate=group.rate;return v.play();})).then(()=>{
   if(!group.playing||version!==group.playVersion)return;
   group.buffering=false;play.textContent='Pause all';group.lastSync=Date.now();
  }).catch(error=>{if(version===group.playVersion){group.pause();document.getElementById('error').textContent=error.message;}}).finally(()=>{if(version===group.playVersion)group.resumePending=false;});
 }
 function tick(){
  if(!group.playing)return;
  const times=group.videos.map(v=>v.currentTime),t=Math.min(...times),end=(scene.frames-1)/scene.fps;
  if(t>=end-.025){seek(scene.frames-1);return;}
  if(group.buffering)resumeBuffered();
  else if(group.videos.some(v=>v.readyState<3||v.seeking||bufferedAhead(v)<Math.min(.12*group.rate,end-v.currentTime)))bufferGroup();
  else if(Date.now()-group.lastSync>=1500&&Math.max(...times)-t>.35)bufferGroup();
  display(t);group.raf=requestAnimationFrame(tick);
 }
 for(const clip of scene.clips){const card=document.createElement('div');card.className='clip';const title=document.createElement('h2');title.textContent=clip.label;const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='none';v.poster=clip.poster;v.setAttribute('aria-label',clip.label);const media=document.createElement('div');media.className='media';const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('highlights');svg.setAttribute('viewBox','0 0 832 480');svg.setAttribute('aria-hidden','true');media.append(v,svg);card.append(title,media);grid.append(card);group.videos.push(v);group.overlays.push(svg);for(const event of ['timeupdate','seeking','seeked','loadeddata'])v.addEventListener(event,()=>drawHighlights(svg,scene,v.currentTime));drawHighlights(svg,scene,0);}
 controls.append(play,restart,speedLabel,output);
 speed.addEventListener('change',()=>{group.rate=Number(speed.value);group.videos.forEach(v=>{v.defaultPlaybackRate=group.rate;v.playbackRate=group.rate;});});section.append(grid,controls,timeline);
 play.addEventListener('click',async()=>{if(group.playing){group.pause();return;}const version=++group.playVersion;play.disabled=true;play.textContent='Loading...';try{groups.forEach(other=>{if(other!==group)other.pause();});await load();if(version!==group.playVersion)return;if(Number(timeline.value)>=scene.frames-1){group.videos.forEach(v=>{v.currentTime=0;});display(0);}group.videos.forEach(v=>{v.playbackRate=group.rate;});group.playing=true;group.resumePending=false;bufferGroup();tick();}catch(error){group.pause();document.getElementById('error').textContent=error.message;}finally{play.disabled=false;}});
 restart.addEventListener('click',async()=>{group.pause();try{await load();seek(0);}catch(error){document.getElementById('error').textContent=error.message;}});
 timeline.addEventListener('input',()=>seek(timeline.value));
 if('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{for(const e of entries){if(!e.isIntersecting)group.pause();}},{rootMargin:'300px'});observer.observe(section);}
 return section;
}
Promise.resolve(displayData).then(data=>{document.getElementById('comparisons').replaceChildren(...data.comparisons.map(makeComparison));}).catch(error=>{document.getElementById('error').textContent=error.message;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)groups.forEach(g=>g.pause());});
</script></body></html>
